<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070C">
<title>Timing · Race Engineer</title>
<style>
@font-face { font-family: Inter; font-weight: 500; src: url(/assets/Inter-Medium.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(/assets/Inter-SemiBold.ttf); }
@font-face { font-family: Inter; font-weight: 700; src: url(/assets/Inter-Bold.ttf); }
@font-face { font-family: Barlow; font-weight: 700; src: url(/assets/BarlowCondensed-Bold.ttf); }
@font-face { font-family: Barlow; font-weight: 800; src: url(/assets/BarlowCondensed-ExtraBold.ttf); }
:root {
  --bg0: #05070C; --bg1: #0A0F1B; --line: rgba(255,255,255,.06); --line2: rgba(255,255,255,.11);
  --glass: rgba(13,20,36,.82); --glass2: rgba(20,29,50,.6);
  --gold: #C5A572; --gold2: #FFD876; --ivory: #FCFAF5; --t2: #E5E7EB; --t3: #9CA3AF; --t4: #6B7280; --t5: #3B4252;
  --pur: #B07CFF; --grn: #2BD46A; --yel: #E8C547; --red: #F05252; --org: #FF8A3D; --blu: #60A5FA;
  --rowh: 34px; --fs: 17px; --side: 360px;
  --num: Barlow, "Barlow Condensed", "Arial Narrow", sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--ivory); font-family: Inter, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(1200px 420px at 30% -200px, rgba(197,165,114,.11), transparent 70%),
              radial-gradient(900px 600px at 100% 120%, rgba(27,62,140,.18), transparent 70%); }
button { font-family: inherit; -webkit-appearance: none; appearance: none; cursor: pointer; }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* ===================== header ===================== */
header { display: flex; align-items: stretch; gap: 0; height: 62px; border-bottom: 1px solid var(--line2);
  background: linear-gradient(180deg, rgba(16,23,40,.95), rgba(9,13,24,.92)); position: relative; z-index: 6; }  /* above the "waiting" cover so the watch hangs over it */
header .blk { display: flex; flex-direction: column; justify-content: center; padding: 0 18px; border-right: 1px solid var(--line); min-width: 0; }
header .lbl { font: 700 10px Inter; letter-spacing: .22em; color: var(--t3); text-transform: uppercase; white-space: nowrap; }
header .val { font: 600 15px Inter; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
#hSess .val { max-width: 34vw; }
#hClock { min-width: 190px; align-items: flex-start; }
#hClock .big { font: 800 32px/1 var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; margin-top: 1px; }
#hClock .big small { font: 700 15px var(--num); color: var(--t3); margin-left: 6px; letter-spacing: .06em; }
#hFlag { position: relative; overflow: hidden; min-width: 170px; }
#hFlag .flag { font: 800 19px var(--num); letter-spacing: .09em; margin-top: 2px; }
#hFlag::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .6s; }
#hFlag.grn::before { background: rgba(43,212,106,.10); opacity: 1; } #hFlag.grn .flag { color: #7BE3A3; }
#hFlag.yel::before { background: rgba(232,197,71,.88); opacity: 1; animation: pulse 1.3s ease-in-out infinite; } #hFlag.yel .flag, #hFlag.yel .lbl { color: #1A1405; position: relative; }
#hFlag.red::before { background: rgba(240,82,82,.9); opacity: 1; } #hFlag.red .flag, #hFlag.red .lbl { color: #fff; position: relative; }
#hFlag.wht::before { background: rgba(255,255,255,.88); opacity: 1; } #hFlag.wht .flag, #hFlag.wht .lbl { color: #0B0F19; position: relative; }
#hFlag.chk::before { opacity: .9; background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 14px 14px; }
#hFlag.chk .flag { color: #fff; position: relative; text-shadow: 0 1px 6px #000, 0 0 2px #000; } #hFlag.chk .lbl { color: #fff; position: relative; text-shadow: 0 0 4px #000; }
#hFlag .flag, #hFlag .lbl { position: relative; }
@keyframes pulse { 50% { filter: brightness(.82); } }
header .sp { flex: 1; display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
/* the same watch as the iPad and the PC app, hanging from the bar */
#tmWatch { position: absolute; left: 50%; top: 5px; width: 78px; height: 78px; margin-left: -39px; z-index: 4; filter: drop-shadow(0 8px 18px rgba(0,0,0,.65)); pointer-events: none; }
#tmWatch.clash { display: none; }
.wbox { position: relative; width: 100%; height: 100%; }
.wbox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wbox .hand { transform-origin: 50% 50%; will-change: transform; }
body.strip #tmWatch { width: 62px; height: 62px; margin-left: -31px; top: 4px; }
#hWx { flex-direction: row; align-items: center; gap: 16px; }
#hWx .w { display: flex; flex-direction: column; }
#hWx .w b { font: 800 20px/1.1 var(--num); font-variant-numeric: tabular-nums; }
#hWx .w b small { font-size: 13px; color: var(--t3); margin-left: 1px; }
.ctrl { display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.seg { display: flex; background: rgba(255,255,255,.04); border: 1px solid var(--line2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--t3); font: 700 11px Inter; letter-spacing: .14em; padding: 8px 11px; border-radius: 7px; text-transform: uppercase; transition: background .2s, color .2s; white-space: nowrap; }
.seg button.on { background: rgba(197,165,114,.18); color: var(--gold2); }
.seg button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.ibtn { height: 36px; min-width: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(255,255,255,.04); color: var(--t2);
  font: 700 11px Inter; letter-spacing: .14em; display: flex; align-items: center; gap: 7px; }
.ibtn:active { transform: scale(.95); }
.ibtn svg { width: 16px; height: 16px; }
.ibtn.gold { border-color: rgba(255,216,118,.45); background: rgba(197,165,114,.12); color: var(--gold2); }

/* ===================== body ===================== */
#body { display: grid; grid-template-columns: 1fr var(--side); min-height: 0; }
body.v-timing #body { grid-template-columns: 1fr; } body.v-timing #side { display: none; }
body.v-session #body { grid-template-columns: 1fr; } body.v-session #tower { display: none; }
body.v-session #side { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-content: start; border-left: 0; }

/* ----- timing table ----- */
#tower { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.thead, .row { display: grid; align-items: center;
  grid-template-columns: 48px 34px 62px minmax(130px, 1fr) 86px 92px 100px 108px repeat(3, minmax(66px, 118px)) 46px 48px 62px; }
body.narrow .thead, body.narrow .row { grid-template-columns: 40px 34px 54px minmax(100px, 1fr) 76px 80px 92px 96px repeat(3, minmax(58px, 80px)) 40px 0 54px; }
body.narrow .c-tyre { display: none; }
.thead { height: 30px; padding: 0 8px; border-bottom: 1px solid var(--line2); font: 700 10px Inter; letter-spacing: .16em; color: var(--t4); text-transform: uppercase; }
.thead > div { padding: 0 6px; white-space: nowrap; }
.thead .r, .row .r { text-align: right; }
.thead .c, .row .c { text-align: center; }
#rows { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 8px 12px; scrollbar-width: none; }
#rows::-webkit-scrollbar { display: none; }
.row { position: relative; height: var(--rowh); border-radius: 7px; font: 700 var(--fs) var(--num); font-variant-numeric: tabular-nums;
  transition: transform .7s var(--ease), opacity .4s, background .4s; will-change: transform; }
.row:nth-child(even of .row) { background: rgba(255,255,255,.018); }
.row > div { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .pos { font-size: calc(var(--fs) * 1.12); text-align: center; color: var(--ivory); }
.row .chg { font: 700 11px var(--num); text-align: center; letter-spacing: 0; }
.row .chg.up { color: var(--grn); } .row .chg.dn { color: var(--red); } .row .chg.eq { color: var(--t5); }
.row .num { display: flex; align-items: center; justify-content: center; }
.row .num span { min-width: 44px; height: calc(var(--rowh) - 10px); border-radius: 5px; display: flex; align-items: center; justify-content: center;
  font: 800 calc(var(--fs) * .95) var(--num); color: #0B0F19; background: var(--cc, var(--gold)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.row .drv { font: 600 calc(var(--fs) * .82) Inter; letter-spacing: .02em; color: var(--t2); display: flex; align-items: baseline; gap: 8px; }
.row .drv .ir { font: 600 calc(var(--fs) * .62) Inter; color: var(--t4); letter-spacing: .04em; }
.row .int, .row .gap { color: var(--t2); }
.row .int.closing { color: var(--grn); } .row .int.losing { color: #F59E8B; }
.row .int i { font-style: normal; font-size: .7em; margin-left: 3px; }
.row .gap.lead { color: var(--gold); font: 700 calc(var(--fs) * .62) Inter; letter-spacing: .18em; }
.row .last.p, .row .best.p { color: var(--pur); } .row .last.g { color: var(--grn); }
.row .best { color: var(--t3); }
.row .best.p::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pur); margin-right: 6px; vertical-align: .12em; box-shadow: 0 0 8px var(--pur); }
.row .sec { position: relative; align-self: stretch; display: flex; align-items: center; justify-content: flex-end; color: var(--t3); font-size: calc(var(--fs) * .88); }
.row .sec::after { content: ""; position: absolute; left: 8px; right: 6px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--t5); opacity: .4; transition: background .3s; }
.row .sec.ghost { color: var(--t5); }
.row .sec.p { color: var(--pur); } .row .sec.p::after { background: var(--pur); opacity: 1; box-shadow: 0 0 6px var(--pur); }
.row .sec.g { color: var(--grn); } .row .sec.g::after { background: var(--grn); opacity: 1; }
.row .sec.y { color: var(--yel); } .row .sec.y::after { background: var(--yel); opacity: 1; }
.row .sec.ghost.p::after, .row .sec.ghost.g::after, .row .sec.ghost.y::after { opacity: .3; box-shadow: none; }
.row .sec.ghost.p, .row .sec.ghost.g, .row .sec.ghost.y { color: var(--t4); }
.row .sec.live::after { background: linear-gradient(90deg, var(--t3), transparent); opacity: .9; animation: live 1.1s ease-in-out infinite; }
@keyframes live { 50% { opacity: .25; } }
.row .stops { text-align: center; color: var(--t2); }
.row .c-tyre { text-align: center; color: var(--t3); }
.row .st { text-align: center; }
.badge { display: inline-block; font: 800 11px Inter; letter-spacing: .12em; padding: 3px 7px; border-radius: 4px; }
.badge.pit { background: var(--org); color: #1A0B02; } .badge.out { background: var(--t5); color: var(--t2); }
.badge.off { background: rgba(232,197,71,.2); color: var(--yel); } .badge.pen { background: #111; color: #fff; outline: 1px solid #fff; }
.badge.rep { background: #111; color: var(--org); outline: 1px solid var(--org); }
.row.inpit { opacity: .62; }
.row.me { background: linear-gradient(90deg, rgba(197,165,114,.26), rgba(197,165,114,.08) 60%, rgba(197,165,114,.04)) !important; }
.row.me::before { content: ""; position: absolute; left: -8px; top: 3px; bottom: 3px; width: 4px; border-radius: 2px; background: var(--gold2); box-shadow: 0 0 10px var(--gold2); }
.row.me .drv { color: var(--gold2); }
.row.nb::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--blu); opacity: .7; }
.row.flash-up { animation: fup 1.4s ease-out; } .row.flash-dn { animation: fdn 1.4s ease-out; }
@keyframes fup { 0% { background: rgba(43,212,106,.32); } } @keyframes fdn { 0% { background: rgba(240,82,82,.28); } }
.row.fastflash { animation: fpur 2.2s ease-out; } @keyframes fpur { 0%, 20% { background: rgba(176,124,255,.38); } }
.chead { display: flex; align-items: center; gap: 10px; height: 30px; margin: 10px 0 4px; padding: 0 8px; font: 700 11px Inter; letter-spacing: .2em; color: var(--t3); text-transform: uppercase; }
.chead:first-child { margin-top: 2px; }
.chead i { width: 10px; height: 10px; border-radius: 3px; background: var(--cc); }
.chead em { font-style: normal; color: var(--t4); letter-spacing: .1em; }
.chead .fl { margin-left: auto; color: var(--pur); letter-spacing: .08em; font: 700 13px var(--num); }

/* ----- session side ----- */
#side { border-left: 1px solid var(--line2); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; min-height: 0; }
#side::-webkit-scrollbar { display: none; }
.card { background: var(--glass); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 16px; }
.card h4 { margin: 0 0 10px; font: 700 10px Inter; letter-spacing: .24em; color: var(--gold); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.card h4 .x { margin-left: auto; color: var(--t4); letter-spacing: .12em; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
.kv > div { display: flex; flex-direction: column; min-width: 0; }
.kv span { font: 700 9.5px Inter; letter-spacing: .18em; color: var(--t4); text-transform: uppercase; }
.kv b { font: 800 22px/1.15 var(--num); font-variant-numeric: tabular-nums; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv b small { font-size: 13px; color: var(--t3); }
.kv b.gold { color: var(--gold2); } .kv b.pur { color: var(--pur); } .kv b.grn { color: var(--grn); } .kv b.red { color: var(--red); }
.wind { display: inline-block; width: 15px; height: 15px; margin-left: 4px; vertical-align: -2px; transition: transform 1s var(--ease); }
.unit { border: 1px solid var(--line2); background: transparent; color: var(--t3); font: 700 10px Inter; letter-spacing: .1em; border-radius: 6px; padding: 3px 7px; }
.trk { font: 600 15px Inter; color: var(--t2); margin: -2px 0 10px; }
.trk small { display: block; font: 500 12px Inter; color: var(--t4); margin-top: 3px; }
.fcls { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.fcls:first-of-type { border-top: 0; padding-top: 0; }
.fcls i { width: 10px; height: 10px; border-radius: 3px; background: var(--cc); }
.fcls .n { font: 700 12px Inter; letter-spacing: .14em; color: var(--t2); }
.fcls .t { font: 800 21px var(--num); color: var(--pur); font-variant-numeric: tabular-nums; text-align: right; }
.fcls .who { grid-column: 2 / 4; font: 500 12px Inter; color: var(--t3); display: flex; justify-content: space-between; }
.fcls .secs { grid-column: 2 / 4; display: flex; gap: 6px; font: 700 13px var(--num); color: var(--t3); }
.fcls .secs span { flex: 1; padding: 3px 6px; border-radius: 5px; background: rgba(176,124,255,.1); color: #CDB2FF; text-align: center; font-variant-numeric: tabular-nums; }
.fcls .secs span.ideal { background: rgba(255,255,255,.05); color: var(--t2); flex: 1.3; }
#rc { display: flex; flex-direction: column; gap: 2px; max-height: 360px; overflow-y: auto; scrollbar-width: none; }
body.v-session #rc { max-height: none; }
#rc::-webkit-scrollbar { display: none; }
.rcl { display: grid; grid-template-columns: 52px 54px 1fr; gap: 8px; align-items: baseline; padding: 6px 2px; border-top: 1px solid var(--line); font: 500 13px Inter; color: var(--t2); }
.rcl:first-child { border-top: 0; }
.rcl.new { animation: rcin .8s var(--ease); } @keyframes rcin { from { transform: translateX(16px); opacity: 0; background: rgba(197,165,114,.15); } }
.rcl time { font: 700 13px var(--num); color: var(--t4); font-variant-numeric: tabular-nums; }
.rcl .k { font: 800 9.5px Inter; letter-spacing: .14em; padding: 3px 0; border-radius: 4px; text-align: center; background: rgba(255,255,255,.07); color: var(--t3); }
.rcl .k.fast { background: rgba(176,124,255,.18); color: var(--pur); } .rcl .k.pit { background: rgba(255,138,61,.16); color: var(--org); }
.rcl .k.flag { background: rgba(232,197,71,.16); color: var(--yel); } .rcl .k.lead { background: rgba(197,165,114,.18); color: var(--gold2); }
.rcl .k.pen { background: #000; color: #fff; outline: 1px solid rgba(255,255,255,.4); } .rcl .k.off { background: rgba(232,197,71,.1); color: #CBB45A; }
.empty { color: var(--t4); font: 500 13px Inter; padding: 6px 0; }

/* ----- states ----- */
#wait { position: fixed; inset: 62px 0 0; display: none; align-items: center; justify-content: center; z-index: 5; background: rgba(5,7,12,.78); backdrop-filter: blur(6px); }
body.waiting #wait { display: flex; }
#wait div { text-align: center; } #wait b { display: block; font: 800 30px var(--num); letter-spacing: .08em; color: var(--gold2); }
#wait span { font: 500 14px Inter; color: var(--t3); }
body.locked #viewSeg { display: none; }
body.lost header .val#hTrk::after { content: " · reconnecting…"; color: var(--red); }

/* the screen above the triples: short and very wide */
body.strip header { height: 50px; }
body.strip #hClock .big { font-size: 27px; }
body.strip #side { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; }
body.strip #side .card { min-width: 300px; }
@media (max-width: 1399px) { #hWx { display: none; } header .blk { padding: 0 14px; } #hClock { min-width: 150px; } #hFlag { min-width: 140px; } .ibtn:not(.pop) span { display: none; } }
@media (max-width: 1000px) { #hSess { display: none; } }
@media (max-width: 1299px) { .row .drv .ir { display: none; } }
</style>
</head>
<body class="v-both waiting">
<div id="app">
  <header>
    <div class="blk" id="hSess"><div class="lbl" id="hType">Session</div><div class="val" id="hTrk">Waiting for iRacing</div></div>
    <div class="blk" id="hClock"><div class="lbl" id="hClockL">Time left</div><div class="big" id="hClockV">–</div></div>
    <div class="blk" id="hFlag"><div class="lbl">Track</div><div class="flag" id="hFlagV">–</div></div>
    <div class="blk" id="hWx"><div class="w"><span class="lbl">Air</span><b id="hAir">–</b></div><div class="w"><span class="lbl">Track</span><b id="hTt">–</b></div></div>
    <div class="sp"></div>
    <div id="tmWatch" title="Local time"></div>
    <div class="ctrl"><div class="seg" id="clsSeg"></div></div>
    <div class="ctrl">
      <div class="seg" id="viewSeg"><button data-v="timing">Timing</button><button data-v="both" id="vBoth">Both</button><button data-v="session">Session</button></div>
      <button class="ibtn pop" data-pop="timing" title="Timing in its own window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>TIMING</span></button>
      <button class="ibtn pop" data-pop="session" title="Session in its own window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>SESSION</span></button>
      <button class="ibtn" id="fsBtn" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ibtn gold" id="backBtn">DASHBOARD</button>
    </div>
  </header>
  <div id="body">
    <section id="tower">
      <div class="thead">
        <div class="c">Pos</div><div></div><div class="c">No</div><div>Driver</div><div class="r">Int</div><div class="r">Gap</div>
        <div class="r">Last</div><div class="r">Best</div><div class="r">S1</div><div class="r">S2</div><div class="r">S3</div>
        <div class="c">Pit</div><div class="c c-tyre">Tyre</div><div class="c"></div>
      </div>
      <div id="rows"></div>
    </section>
    <aside id="side">
      <div class="card" id="cTrack"><h4>Track &amp; weather <span class="x"><button class="unit" id="unitBtn">°F</button></span></h4><div class="trk" id="trkName">–</div><div class="kv" id="wxKv"></div></div>
      <div class="card" id="cMe"><h4>Your session</h4><div class="kv" id="meKv"></div></div>
      <div class="card" id="cFast"><h4>Fastest laps &amp; best sectors</h4><div id="fastBox"></div></div>
      <div class="card" id="cRc"><h4>Race control <span class="x" id="rcN"></span></h4><div id="rc"></div></div>
    </aside>
  </div>
  <!-- inside #app so the bar (and the watch hanging from it) stays above this cover -->
  <div id="wait"><div><b>WAITING FOR iRACING</b><span>Leave the Race Engineer running on the PC</span></div></div>
</div>
<script src="timing.js"></script>
</body>
</html>
