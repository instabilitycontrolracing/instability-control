<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Night review</title>
<!-- forensics (2026-10-27): tonight's races on the iPad - results, every incident with the why, the fix and its trace -->
<style>
@font-face { font-family: Inter; font-weight: 500; src: url(/assets/Inter-Medium.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(/assets/Inter-SemiBold.ttf); }
@font-face { font-family: Inter; font-weight: 700; src: url(/assets/Inter-Bold.ttf); }
@font-face { font-family: Cormorant; font-weight: 700; src: url(/assets/CormorantGaramond-Bold.ttf); }
:root { --bg0: #05070C; --ivory: #F5F3EE; --t2: #D5DAE3; --t3: #8E98AC; --gold: #D8B46A; --gold2: #F0CD7E; --rule: rgba(255,255,255,.075); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg0); color: var(--ivory); font-family: Inter, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 40px max(18px, env(safe-area-inset-left)); }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(1200px 520px at 50% -140px, rgba(197,165,114,.14), transparent 70%); }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
header h1 { margin: 0; font: 700 34px/1 Cormorant, serif; letter-spacing: .04em; }
header .w { flex: 1; font: 500 13px Inter; color: var(--t3); }
header button { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; font: 700 11px Inter; letter-spacing: .14em; color: var(--gold2); background: rgba(255,216,118,.08); box-shadow: inset 0 0 0 1px rgba(255,216,118,.3); }
.lbl { font: 700 10px Inter; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { border-radius: 14px; background: rgba(3,6,13,.6); box-shadow: inset 0 0 0 1px var(--rule); padding: 14px 16px; }
.card ul { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.card li { position: relative; padding-left: 12px; font: 500 14px/1.5 Inter; color: var(--t2); }
.card li::before { content: ""; position: absolute; left: 0; top: .65em; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
h2 { margin: 26px 0 10px; font: 700 24px Cormorant, serif; letter-spacing: .04em; }
.sess { margin-top: 18px; }
.sess .sl { margin: 0 0 8px; }
.row { margin: 8px 0; border-radius: 12px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px var(--rule); }
.row.open { box-shadow: inset 0 0 0 1px rgba(255,216,118,.3); }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
.top .t { flex: 1; font: 600 15px Inter; }
.top .m { font: 600 12px Inter; color: var(--t3); }
.c { padding: 0 14px 12px; font: 500 14px Inter; color: var(--gold2); }
.body { padding: 2px 16px 16px; }
canvas.fx-cv { display: block; width: 100%; height: 280px; border-radius: 10px; background: rgba(0,0,0,.3); }
.clean { font: 500 14px Inter; color: #86EFAC; }
.err { margin-top: 40px; text-align: center; color: var(--t3); }
</style>
</head>
<body>
<header><h1>Night review</h1><span class="w" id="where">Loading…</span><button onclick="location.href='./'+location.search">BACK</button></header>
<div class="grid" id="facts"></div>
<div id="sessions"></div>
<script src="fxview.js"></script>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
let KEY = qs.get("k") || ""; try { if (KEY) localStorage.setItem("re_key", KEY); else KEY = localStorage.getItem("re_key") || ""; } catch (e) {}
const E = FX.esc;
async function get(p) { const r = await fetch(`${p}${p.includes("?") ? "&" : "?"}k=${encodeURIComponent(KEY)}`); return r.ok ? r.json() : null; }
(async function () {
  let rv = null; try { rv = await get("/api/debrief"); } catch (e) {}
  if (!rv || rv.error) { document.getElementById("where").textContent = ""; document.getElementById("facts").innerHTML = `<div class="err">${E((rv && rv.error) || "Can't reach the Race Engineer on the PC.")}</div>`; return; }
  document.getElementById("where").textContent = `${rv.car || ""} · ${rv.track || ""} · ${rv.date || ""}`;
  document.getElementById("facts").innerHTML = (rv.sections || []).filter((s) => !s.sid).map((s) =>
    `<div class="card"><span class="lbl">${E(s.h)}</span><ul>${s.lines.map((l) => `<li>${E(l)}</li>`).join("")}</ul></div>`).join("");
  const box = document.getElementById("sessions");
  for (const s of rv.sessions || []) {
    const sec = (rv.sections || []).find((x) => x.sid === s.id);
    const d = document.createElement("div"); d.className = "sess";
    d.innerHTML = `<h2>${E(s.long_label)}</h2>${sec ? `<div class="card"><ul>${sec.lines.map((l) => `<li>${E(l)}</li>`).join("")}</ul></div>` : ""}`
      + (s.episodes.length ? "" : `<p class="clean">Clean: no spins, crashes or offs.</p>`);
    for (const e of s.episodes) {
      const r = document.createElement("div"); r.className = "row";
      r.innerHTML = `<div class="top">${FX.badge(e)}<span class="t">${E(e.title)}</span><span class="m">${E(FX.meta(e))}</span></div><div class="c">${E(e.cause_title)}</div><div class="body" hidden></div>`;
      r.addEventListener("click", async (ev) => {
        if (ev.target.closest(".body")) return;
        const b = r.querySelector(".body");
        if (!b.hidden) { b.hidden = true; r.classList.remove("open"); return; }
        b.hidden = false; r.classList.add("open");
        b.innerHTML = FX.detail(e) + `<div class="vbox"></div>`;
        let t = null; try { t = await get(`/api/fxtrace?sid=${encodeURIComponent(s.id)}&n=${e.n}`); } catch (x) {}
        if (t && t.episode && t.episode.trace) FX.viz(b.querySelector(".vbox"), t.episode.trace);
      });
      d.appendChild(r);
    }
    box.appendChild(d);
  }
})();
</script>
</body>
</html>
