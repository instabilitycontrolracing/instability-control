<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070C">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Track</title>
<!-- ic186 (#729, 2026-11-01): the TRACK page - track learning from his own laps (tracklearn.py via /api/tracklearn):
     practice stage + what to do in it (+ endurance drills), the coach's focus list (max 3, repeating, root cause first),
     coasting / lifts / square braking / minimum speed, braking-board steps, target pace, the reference-point sheet and
     a visualisation timer (client-side only). Same look as REVIEW. -->
<style>
@font-face { font-family: Inter; font-weight: 500; src: url(/assets/Inter-Medium.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(/assets/Inter-SemiBold.ttf); }
@font-face { font-family: Inter; font-weight: 700; src: url(/assets/Inter-Bold.ttf); }
@font-face { font-family: Cormorant; font-weight: 700; src: url(/assets/CormorantGaramond-Bold.ttf); }
@font-face { font-family: Timing; font-weight: 500; src: url(/assets/RaycerRay-F125-Font-Timing-Medium.ttf); }
@font-face { font-family: Timing; font-weight: 700; src: url(/assets/RaycerRay-F125-Font-Timing-Bold.ttf); }
:root {
  --bg0: #05070C; --ivory: #F5F3EE; --t2: #D5DAE3; --t3: #8E98AC; --t4: #5E6880;
  --gold: #D8B46A; --gold2: #F0CD7E; --gold3: #B8964C; --green: #34D27B; --yellow: #FFC93C; --red: #F87171; --purple: #C084FC;
  --well: rgba(3,6,13,.6); --rule: rgba(255,255,255,.075); --rule2: rgba(255,255,255,.13);
  --num: Timing, Inter, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg0); color: var(--ivory); font-family: Inter, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
body { padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 28px max(20px, env(safe-area-inset-left));
  font-feature-settings: "tnum" 1, "lnum" 1; user-select: none; -webkit-user-select: none; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(1200px 520px at 50% -160px, rgba(197,165,114,.13), transparent 70%),
              radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.45)); }
button { font-family: inherit; -webkit-appearance: none; appearance: none; touch-action: manipulation; cursor: pointer; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
header h1 { margin: 0; font: 700 34px/1 Cormorant, serif; letter-spacing: .04em; }
.where { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.where .a { font: 600 14px Inter; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where .b { font: 500 12px Inter; color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where .b i { font-style: normal; color: var(--gold2); }
.pill { height: 36px; padding: 0 15px; border-radius: 18px; border: 0; font: 700 11px Inter; letter-spacing: .14em; color: var(--gold2);
  background: rgba(255,216,118,.08); box-shadow: inset 0 0 0 1px rgba(255,216,118,.3); white-space: nowrap; }
.pill.solid { background: var(--gold2); color: #12141a; box-shadow: none; }
.pill.red { color: #FCA5A5; background: rgba(248,113,113,.10); box-shadow: inset 0 0 0 1px rgba(248,113,113,.4); }
.panel { border-radius: 14px; background: var(--well); box-shadow: inset 0 0 0 1px var(--rule); }
.lbl { font: 700 10px Inter; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.x { color: var(--t4); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { padding: 12px 14px 13px; }
.stat .v { margin-top: 7px; font: 700 26px/1 var(--num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v.word { font: 700 22px/1.1 Inter; }
.stat .v.purple { color: var(--purple); }
.stat .s { margin-top: 7px; font: 500 11.5px/1.35 Inter; color: var(--t3); }
.stat .s b { color: var(--yellow); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; align-items: start; }
.card { padding: 14px 16px 16px; }
.card.wide { grid-column: 1 / -1; }
.card .hd { display: flex; align-items: center; gap: 10px; }
.card .hd .src { margin-left: auto; font: 600 10.5px Inter; color: var(--t4); letter-spacing: .04em; }
.it { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,.35); box-shadow: inset 0 0 0 1px var(--rule); }
.it .t { font: 600 14px/1.3 Inter; }
.it .w { margin-top: 4px; font: 500 12.5px/1.45 Inter; color: var(--t2); }
.it .d { margin-top: 4px; font: 500 12px/1.45 Inter; color: var(--t3); }
.it .num { font: 700 13px var(--num); color: var(--gold2); float: right; }
.it .chain { margin-top: 6px; font: 600 11px Inter; color: var(--t3); }
.it .chain b { color: var(--gold2); }
ul.todo { margin: 10px 0 0; padding-left: 18px; font: 500 13px/1.55 Inter; color: var(--t2); }
.small { font: 500 12px/1.5 Inter; color: var(--t3); margin: 8px 0 0; }
.emp { margin-top: 10px; font: 500 13px/1.5 Inter; color: var(--t3); }
table { width: 100%; border-collapse: collapse; margin-top: 8px; }
th { padding: 6px 8px; font: 700 9.5px Inter; letter-spacing: .14em; color: var(--t4); text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 0 8px; height: 38px; font: 600 14px var(--num); color: var(--t2); text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td.n { font: 600 13px Inter; color: var(--ivory); }
td.txt { font: 500 12px/1.35 Inter; color: var(--t3); text-align: left; white-space: normal; }
td.up { color: #FCA5A5; } td.dn { color: #86EFAC; }
td.note { min-width: 160px; border-left: 1px dashed var(--rule2); }
.tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font: 700 9.5px Inter; letter-spacing: .1em; }
.tag.step { background: rgba(52,210,123,.13); color: #86EFAC; } .tag.hold { background: rgba(248,113,113,.15); color: #FCA5A5; }
.tag.settle { background: rgba(255,201,60,.13); color: var(--yellow); } .tag.at_best { background: rgba(192,132,252,.18); color: var(--purple); }
/* visualisation timer */
.viz { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; align-items: center; }
.viz .clock { font: 700 64px/1 var(--num); letter-spacing: .02em; }
.viz .clock.run { color: var(--gold2); }
.viz .btns { display: flex; gap: 10px; margin-top: 14px; }
.viz .btns .pill { height: 48px; padding: 0 26px; font-size: 13px; }
.viz .cmp div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--rule); font: 600 15px var(--num); color: var(--t2); }
.viz .cmp u { text-decoration: none; font: 600 12px Inter; color: var(--t3); }
.viz .ok { color: var(--green); } .viz .bad { color: #FCA5A5; }
@media (max-width: 1180px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cards { grid-template-columns: 1fr; } .viz { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Track</h1>
  <div class="where"><span class="a" id="whereA">Loading…</span><span class="b" id="whereB"></span></div>
  <button class="pill" id="review">REVIEW</button>
  <button class="pill" id="back">DASHBOARD</button>
</header>
<div id="page"></div>
<section class="panel card wide" style="margin-top:14px">
  <div class="hd"><span class="lbl">Visualisation timer</span><span class="src">eyes closed: drive one lap in your head, tap STOP at the line</span></div>
  <div class="viz">
    <div><div class="clock" id="vzClock">0:00.0</div>
      <div class="btns"><button class="pill solid" id="vzStart">START</button><button class="pill red" id="vzStop">STOP</button><button class="pill" id="vzReset">RESET</button></div></div>
    <div class="cmp" id="vzCmp"></div>
  </div>
  <p class="small">Goal: within 1 second of your real lap. Nothing is sent to the PC - the timer runs on the iPad only.</p>
</section>
<script src="learn.js"></script>
</body>
</html>
